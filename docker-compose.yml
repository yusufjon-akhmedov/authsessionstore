services:
  postgres:
    image: postgres:16-alpine
    container_name: authsessionstore-postgres
    environment:
      POSTGRES_DB: auth_session_store
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5436:5432"
    volumes:
      - authsessionstore_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: authsessionstore-redis
    ports:
      - "6379:6379"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: authsessionstore-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/auth_session_store
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: NzQ5YmY2NzAtYmFiYS00NTEwLWEwYjItYmQyNmE4YWRkNzYzLTY0YmY2NzAtYmFiYS00NTEwLWEwYjItYmQyNmE4YWRkNzYz
    depends_on:
      - postgres
      - redis

volumes:
  authsessionstore_postgres_data: